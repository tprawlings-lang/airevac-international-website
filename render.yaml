# Render Blueprint. https://render.com/docs/blueprint-spec
#
# Deploys the public site as a Node web service, plus a Postgres database for
# the coordinator console and chat.
#
# It is NOT a static site: HTML is rendered per request so the CSP nonce is real
# (docs/adr/0004-security-headers.md), /api/callback needs a server runtime, and
# the chat holds long-lived Server-Sent Events connections.
#
# ONE INSTANCE ONLY, and this is a correctness constraint rather than a cost
# one. Chat messages fan out through an in-process event bus, so a second
# instance would leave each side of a conversation seeing only their own
# messages. That is worse than an outage, because it looks like the other person
# stopped replying. See src/server/chat/events.ts for the Postgres LISTEN/NOTIFY
# swap that lifts this.

databases:
  - name: airevac-db
    databaseName: airevac
    user: airevac
    plan: basic-256mb
    region: virginia
    # Transcripts contain patient information. Point-in-time recovery is part of
    # the retention story: see question 3 in docs/plans/coordinator-chat-plan.md
    # section 7.1 about how long deleted rows persist in backups.

services:
  - type: web
    name: airevac-website-preview
    runtime: node
    plan: starter
    region: virginia
    branch: claude/air-evac-website-6c03r7

    buildCommand: npm ci && npm run build
    # Migrations run before the server starts, so a deploy can never serve a
    # schema it does not have. Skips cleanly when DATABASE_URL is absent.
    startCommand: npm start

    healthCheckPath: /healthz

    # See the note above. Do not raise this while chat uses the in-process bus.
    numInstances: 1

    envVars:
      - key: NODE_VERSION
        value: 22.22.2

      # Set this to the Render URL of THIS service, e.g.
      #   https://airevac-website-preview.onrender.com
      #
      # SITE_URL controls canonical tags, hreflang, the sitemap, and the robots
      # policy. Any value other than https://airevacinternational.com causes the
      # site to serve `noindex` and a disallow-all robots.txt, which is what a
      # preview must do and which does not affect anyone opening the link.
      #
      # It also gates two safety checks: stub translation is refused on the
      # production origin, and enabling chat there logs a loud warning.
      - key: SITE_URL
        sync: false

      # Wired automatically from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: airevac-db
          property: connectionString

      # ---------------------------------------------------------------
      # Coordinator console and chat. See docs/testing-on-render.md.
      # ---------------------------------------------------------------

      # LEAVE UNSET. The default is derived from SITE_URL: chat is on for any
      # preview origin and off on https://airevacinternational.com, so a demo
      # works with no configuration and production has to opt in deliberately.
      #
      # Setting it here would defeat that. This key exists only so an operator
      # can force chat off on a preview ('false') or, once the Business
      # Associate Agreement covering this database is executed, on
      # ('true') for production. A chat receives patient details within the
      # first minute, which is why production is opt-in.
      - key: CHAT_ENABLED
        sync: false

      # Seeds the first administrator as admin/admin, forced to change on first
      # sign-in. Only acts while no admin exists, so it is inert once a real
      # administrator has a password.
      #
      # 'true' HERE ON PURPOSE: this blueprint describes the preview service,
      # and without it there is no way to sign into the console for the first
      # time. Set it to 'false' once the real administrator account exists, and
      # it must be 'false' on production.
      - key: ALLOW_BOOTSTRAP_ADMIN
        value: 'true'

      # 'stub' produces visibly marked placeholder translations so the
      # translated view can be exercised before AWS exists. Refused on the
      # production origin in code, not merely by instruction.
      - key: TRANSLATION_MODE
        sync: false

      # Notification recipient for callback submissions and chat transcripts.
      # A TESTING ADDRESS TODAY. Move to the operations mailbox before the site
      # accepts real enquiries; callback notifications carry a name and number.
      - key: OPS_NOTIFICATION_EMAIL
        sync: false

      # Without a key, mail is logged rather than sent. That is a working state.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # AWS Translate. See docs/aws-translate-setup.md. All three are required
      # together; any missing and the app behaves as unconfigured.
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

      # OPTIONAL preview lock (HTTP Basic auth), implemented in src/proxy.ts.
      # Disabled unless BOTH are set. Leave unset for an open preview.
      # - key: PREVIEW_USERNAME
      #   sync: false
      # - key: PREVIEW_PASSWORD
      #   sync: false
